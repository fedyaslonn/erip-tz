[project]
name = "erip-tz"
version = "0.1.0"
description = ""
authors = [
    {name = "Fedyaslonn",email = "wisp47344@gmail.com"}
]
requires-python = "^3.13"
dependencies = [
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy[asyncio] (>=2.1.8,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "apscheduler (>=3.11.3,<4.0.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "tzdata (>=2026.6,<2027.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.10.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "flake8 (>=7.5.0,<8.0.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "pytest (>=9.2.0,<10.0.0)"
]

[tool.isort]
profile = "black"
length_sort = true
reverse_sort = true

[tool.pytest.ini_options]
testpaths = ["tests"]
